spring.application.name=scheduling-api

# 1. Database Connection URL
spring.datasource.url=jdbc:mysql://localhost:3306/clinic_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# 2. Your MySQL Credentials
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Auto create/update tables
spring.jpa.hibernate.ddl-auto=update

# 4. Print SQL statements to the console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# JWT Configuration (256-bit secret key in base64/hex)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# 24 Hours in milliseconds (86,400,000 ms)
jwt.expiration=86400000
# ==========================================
# Asynchronous Notification Configuration
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:noreply.clinicapi@gmail.com}
spring.mail.password=${MAIL_PASSWORD:dummyPassword}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
